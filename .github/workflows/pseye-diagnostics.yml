name: PSMoveServiceEx camera diagnostics
on:
  pull_request:
    paths:
      - 'utils/PSEyeCapture/**'
      - 'utils/PSEyeCapture.Tests/**'
      - 'utils/PSMoveServiceExFixes/**'
      - 'DS4Windows/DS4Control/OpticalTracking/**'
      - '.github/workflows/pseye-diagnostics.yml'
  push:
    branches: ['codex/pseye-capture-diagnostics']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ds4-regressions:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Timocop/PSMoveServiceEx
          ref: 308cb9ea55dc1ed32b2c0d60e63d73b1b3c5d9f1
          path: .pseye-service-source
      - name: Apply pinned native fixes
        shell: pwsh
        run: |
          git -C .pseye-service-source submodule update --init --depth 1 thirdparty/eigen thirdparty/protobuf thirdparty/imgui thirdparty/PS3EYEDriver thirdparty/libstem_gamepad
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source initialization failed' }
          python utils/PSMoveServiceExFixes/apply-patches.py .pseye-service-source
          if ($LASTEXITCODE -ne 0) { throw 'Native fixes did not apply' }
      - name: Test actual upstream filter and quaternion code
        shell: pwsh
        run: |
          $source = (Resolve-Path .pseye-service-source).Path.Replace('\', '/')
          cmake -S utils/PSMoveServiceExFixes/tests -B .pseye-native-tests -A x64 "-DPSM_SOURCE=$source"
          if ($LASTEXITCODE -ne 0) { throw 'Native regression configuration failed' }
          cmake --build .pseye-native-tests --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native regression build failed' }
          ctest --test-dir .pseye-native-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native filter regressions failed' }
  synthetic-pipeline:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download pinned build dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory .pseye-tools | Out-Null
          Invoke-WebRequest https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip -OutFile .pseye-tools/zig.zip
          if ((Get-FileHash .pseye-tools/zig.zip -Algorithm SHA256).Hash -ne '554F5378228923FFD558EAC35E21AF020C73789D87AFEABF4BFD16F2E6FEED2C') { throw 'Zig checksum mismatch' }
          Expand-Archive .pseye-tools/zig.zip .pseye-tools/zig
          Invoke-WebRequest https://github.com/Timocop/PSMoveServiceEx/releases/download/v0.27.8/PSMoveClient_CAPI.zip -OutFile .pseye-tools/sdk.zip
          if ((Get-FileHash .pseye-tools/sdk.zip -Algorithm SHA256).Hash -ne '95996E356B25EAFBDF7E43C13852AF299EB392CB169D71310110A43D62A006DC') { throw 'SDK checksum mismatch' }
          Expand-Archive .pseye-tools/sdk.zip .pseye-tools/sdk
      - name: Build and test synthetic adapter pipeline
        shell: pwsh
        run: |
          .\utils\PSEyeCapture\build.ps1 -ZigExe "$PWD\.pseye-tools\zig\zig-x86_64-windows-0.14.1\zig.exe" -PsmSdkRoot "$PWD\.pseye-tools\sdk\PSMoveClient_CAPI"
